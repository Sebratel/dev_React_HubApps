# ============================================================
# Sebratel Hub — Gateway de Autenticação nginx
# ============================================================
# Inclua este arquivo no seu nginx.conf principal:
#   include /etc/nginx/hub-gateway.conf;
#
# Depois adicione em cada server block de app:
#   include /etc/nginx/hub-gateway-location.conf;
# ============================================================

# ─── Localização interna de validação (shared, internal) ─────────────────────
# Chamada pelo auth_request de cada app.
# Ajuste o endereço do hub-api conforme seu ambiente:
#   - Docker na mesma rede:  http://hub-api:3000
#   - Mesmo servidor:        http://127.0.0.1:3000

map $http_cookie $hub_session_cookie {
    default         "";
    "~hub_session=([^;]+)" "$1";
}

