# ============================================================
# exemplo-app.conf — modelo para cada aplicativo protegido
# Copie e ajuste server_name e proxy_pass para cada app.
# ============================================================

server {
    listen      443 ssl;
    server_name financeiro.sebratel.com.br;   # <-- mude para o subdomínio do app

    # SSL — ajuste para os seus certificados
    ssl_certificate     /etc/ssl/sebratel/fullchain.pem;
    ssl_certificate_key /etc/ssl/sebratel/privkey.pem;

    # Inclui os blocos /_hub_auth e @hub_login
    include /etc/nginx/hub-gateway-location.conf;

    location / {
        # 1. Valida sessão Hub antes de liberar
        auth_request /_hub_auth;
        error_page 401 = @hub_login;

        # 2. Repassa para o app interno
        proxy_pass         http://app-financeiro:8080;   # <-- endereço interno do app
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# Redireciona HTTP → HTTPS
server {
    listen      80;
    server_name financeiro.sebratel.com.br;
    return 301  https://$host$request_uri;
}
