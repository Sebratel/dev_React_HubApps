# ============================================================
# hub-gateway-location.conf
# Inclua dentro de cada server block de app com:
#   include /etc/nginx/hub-gateway-location.conf;
# ============================================================

# Subrequest interno de validação de sessão
location = /_hub_auth {
    internal;
    proxy_pass              http://hub-api:3000/auth/validate;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length   "";
    proxy_set_header        X-Original-URI   $request_uri;
    proxy_set_header        X-Original-Host  $host;
    proxy_set_header        Cookie           $http_cookie;
    proxy_connect_timeout   2s;
    proxy_read_timeout      3s;
}

# Redireciona para login do Hub quando sessão ausente/expirada
location @hub_login {
    return 302 https://hub.sebratel.com.br/login?redirect=$scheme://$host$request_uri;
}
