server {
    listen 80;
    server_name hub-api.sebratel.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name hub-api.sebratel.com.br;

    # Certificado SSL — ajustar paths conforme configuração do tech lead
    ssl_certificate     /etc/letsencrypt/live/hub-api.sebratel.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub-api.sebratel.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass         http://hub-api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
