services:
  hub-api:
    build: .
    container_name: hub-api
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      - PORT=${PORT:-3000}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-DB_Hub_Apps}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    volumes:
      - ${FIREBASE_SA_PATH:-./firebase-service-account.json}:/app/firebase-service-account.json:ro
    networks:
      - sebratel-net

networks:
  sebratel-net:
    external: true
